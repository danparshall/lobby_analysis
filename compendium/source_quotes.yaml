"lobbyist_spending_report_filing_cadence":
  "source_quotes":
    "cpi_2015_IND_202": "A 100 score is earned if lobbyists file at least quarterly, itemized expense reports, including amounts, descriptions and lobbied bill number(s). A 50 score is earned if lobbyists file at least semi-annual expense reports, or file them more frequently, but they lack sufficient details. A 0 score is earned if is earned where lobbyists file expense reports annually or less-frequently, and/or they usually lack details."
  "prompt": "A 100 score is earned if lobbyists file at least quarterly, itemized expense reports, including amounts, descriptions and lobbied bill number(s). A 50 score is earned if lobbyists file at least semi-annual expense reports, or file them more frequently, but they lack sufficient details. A 0 score is earned if is earned where lobbyists file expense reports annually or less-frequently, and/or they usually lack details. Under state law, how often must a LOBBYIST file a separate spending report? Answer with one of: 'annual', 'semiannual', 'quarterly', 'monthly', 'biennial', 'triannual', 'other', or 'none'. Use 'none' if lobbyists are not required to file a separate spending report (e.g., if statutory filing duties are assigned only to the principal/employer, with lobbyists providing information to the principal). If 'other', describe the actual cadence in the justification field."
"lobbyist_spending_report_includes_bill_or_action_identifier":
  "source_quotes":
    "sunlight_2015_#1_lobbyist_activity_tier_1_2": "\"Lobbyist Activity: Do lobbyists have to reveal which pieces of legislation or executive actions they are seeking to influence? Tier 2: Lobbyists report the bill/action discussed and position taken; Tier 1: Lobbyists report the bill/action discussed; Tier 0: Lobbyists report the general subjects of lobbying; Tier -1: Lobbyists do not report activity.\""
  "prompt": "\"Lobbyist Activity: Do lobbyists have to reveal which pieces of legislation or executive actions they are seeking to influence? Tier 2: Lobbyists report the bill/action discussed and position taken; Tier 1: Lobbyists report the bill/action discussed; Tier 0: Lobbyists report the general subjects of lobbying; Tier -1: Lobbyists do not report activity.\" Asks whether the LOBBYIST is the named filer of a separate spending report — NOT whether the principal's expense statement contains lobbyist info (e.g., the lobbyist's signature on the principal's form, the lobbyist's name/address listed by the principal, or compensation paid to lobbyists itemized within the principal's aggregate). FALSE in regimes where the statute mandates the PRINCIPAL as the filer of the spending report, even if the principal's report references the lobbyist. Answer with the boolean value true or false."
"lobbyist_spending_report_includes_campaign_contributions":
  "source_quotes":
    "hiredguns_2007_Q24": "24. What is the statutory provision for a lobbyist giving and reporting campaign contributions? Campaign contributions allowed and not required to be disclosed on spending report/prohibited during session – 0 points; Campaign contributions allowed and not required to be disclosed on spending report/allowed during session – 0 points; Campaign contributions allowed and required to be disclosed on spending report/prohibited during session – 1 point; Campaign contributions allowed and required to be disclosed on spending report/allowed during session – 1point; Campaign contributions prohibited – 2 points"
  "prompt": "24. What is the statutory provision for a lobbyist giving and reporting campaign contributions? Campaign contributions allowed and not required to be disclosed on spending report/prohibited during session – 0 points; Campaign contributions allowed and not required to be disclosed on spending report/allowed during session – 0 points; Campaign contributions allowed and required to be disclosed on spending report/prohibited during session – 1 point; Campaign contributions allowed and required to be disclosed on spending report/allowed during session – 1point; Campaign contributions prohibited – 2 points Answer with the boolean value true or false."
"lobbyist_spending_report_includes_compensation_broken_down_by_payer":
  "source_quotes":
    "sunlight_2015_lobbyist_compensation": "Lobbyist Compensation: Does the state mandate that lobbyists disclose how much they receive from a client? Tier 0: Lobbyists disclose earnings received from client/employer for lobbying; Tier −1: Lobbyists do not disclose earnings received from client/employer for lobbying."
  "prompt": "Lobbyist Compensation: Does the state mandate that lobbyists disclose how much they receive from a client? Tier 0: Lobbyists disclose earnings received from client/employer for lobbying; Tier −1: Lobbyists do not disclose earnings received from client/employer for lobbying. Answer with the boolean value true or false."
