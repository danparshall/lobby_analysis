"lobbying_disclosure_audit_required_in_law":
  "source_quotes":
    "cpi_2015_IND_207": "A YES score is earned if there is a legal requirement for the regular auditing of lobbying disclosure records by an impartial third party. A MODERATE score is earned if independent auditing only occurs when financial irregularities are discovered or suspected or the law requires a compliance review. A NO score is earned if no such law exists."
