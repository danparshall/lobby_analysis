services:
  postgres:
    image: postgres:16
    container_name: lobby-postgres
    environment:
      POSTGRES_USER: lobby
      POSTGRES_PASSWORD: lobby
      POSTGRES_DB: lobby_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobby -d lobby_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
