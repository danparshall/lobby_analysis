  "prompt": "A 100 score is earned if lobbying disclosures are audited yearly by an impartial third party. A 50 score is earned if lobbying disclosures are not always independently audited, or they are but audits may fail to identify problems in the information. A 0 score is earned if lobbying disclosures are not independently audited, or they generally fail to identify problems in the information."
